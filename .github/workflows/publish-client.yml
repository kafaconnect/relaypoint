name: publish-client

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@kafaconnect'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # pnpm workspace: install from repo root so the lockfile resolves.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm build
      # public: this is an open-source client SDK (relaypoint is a public repo), consumed org-wide.
      - run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
